<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀点数計算機</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>麻雀点数計算</h1>
            <p class="subtitle">手牌を選ぶだけ。役を自動判定して得点を計算します。</p>
        </header>

        <main class="calculator-card glassmorphism">
            <div class="input-section">
                <!-- 立場選択 -->
                <div class="form-group row-group">
                    <label>立場</label>
                    <div class="radio-group">
                        <input type="radio" id="role-oya" name="role" value="oya" checked>
                        <label for="role-oya" class="radio-label">親</label>
                        <input type="radio" id="role-ko" name="role" value="ko">
                        <label for="role-ko" class="radio-label">子</label>
                    </div>
                </div>

                <!-- あがり方選択 -->
                <div class="form-group row-group">
                    <label>あがり方</label>
                    <div class="radio-group">
                        <input type="radio" id="win-tsumo" name="win_method" value="tsumo" checked>
                        <label for="win-tsumo" class="radio-label">ツモ</label>
                        <input type="radio" id="win-ron" name="win_method" value="ron">
                        <label for="win-ron" class="radio-label">ロン</label>
                    </div>
                </div>

                <!-- 鳴きの有無 -->
                <div class="form-group row-group">
                    <label>鳴き</label>
                    <div class="toggle-switch">
                        <input type="checkbox" id="naki-toggle">
                        <label for="naki-toggle" class="toggle-label">
                            <span class="toggle-inner"></span>
                        </label>
                        <span class="toggle-text">鳴きあり</span>
                    </div>
                </div>

                <!-- 風 -->
                <div class="form-group row-group">
                    <label>風</label>
                    <div class="radio-group" style="gap: 12px;">
                        <div style="display:flex; align-items:center; gap:6px;">
                            <label for="select-bakaze" style="white-space:nowrap; font-size:0.85em;">場風</label>
                            <select id="select-bakaze" class="wind-select">
                                <option value="東">東</option>
                                <option value="南">南</option>
                                <option value="西">西</option>
                                <option value="北">北</option>
                            </select>
                        </div>
                        <div style="display:flex; align-items:center; gap:6px;">
                            <label for="select-jikaze" style="white-space:nowrap; font-size:0.85em;">自風</label>
                            <select id="select-jikaze" class="wind-select">
                                <option value="東">東</option>
                                <option value="南">南</option>
                                <option value="西">西</option>
                                <option value="北">北</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 状況役 -->
                <div class="form-group row-group" id="situational-yaku-group">
                    <label>状況役</label>
                    <div class="yaku-checkbox-group">
                        <label class="yaku-chip" for="opt-riichi"><input type="checkbox"
                                id="opt-riichi"><span>リーチ</span></label>
                        <label class="yaku-chip" for="opt-ippatsu"><input type="checkbox"
                                id="opt-ippatsu"><span>一発</span></label>
                        <label class="yaku-chip" for="opt-double-riichi"><input type="checkbox"
                                id="opt-double-riichi"><span>Wリーチ</span></label>
                        <label class="yaku-chip" for="opt-rinshan"><input type="checkbox"
                                id="opt-rinshan"><span>嶺上開花</span></label>
                        <label class="yaku-chip" for="opt-chankan"><input type="checkbox"
                                id="opt-chankan"><span>槍槓</span></label>
                        <label class="yaku-chip" for="opt-haitei"><input type="checkbox"
                                id="opt-haitei"><span>海底/河底</span></label>
                        <label class="yaku-chip" for="opt-tenhou"><input type="checkbox"
                                id="opt-tenhou"><span>天和/地和</span></label>
                    </div>
                </div>

                <!-- ドラ入力 -->
                <div class="form-group row-group dora-group">
                    <label>ドラ（裏・赤含む）</label>
                    <div class="counter-input">
                        <button type="button" class="counter-btn minus-btn" id="dora-minus">-</button>
                        <input type="number" id="dora-count" value="0" min="0" max="13" readonly>
                        <button type="button" class="counter-btn plus-btn" id="dora-plus">+</button>
                    </div>
                </div>
            </div>

            <!-- 手牌の構成 -->
            <div class="hand-builder-section">
                <div class="hand-header">
                    <div class="hand-title-group">
                        <h3>手牌</h3>
                        <span class="hand-help-text">（同じ牌を4つ選ぶとカンにできます）</span>
                    </div>
                    <span id="hand-count" class="hand-count-badge">0 / 14</span>
                </div>
                <div class="hand-container" id="hand-container">
                    <!-- JavaScript will dynamically populate 14 slots -->
                </div>

                <div class="picker-header">
                    <h3 class="picker-title">牌を選ぶ</h3>
                    <button type="button" id="clear-hand-btn" class="secondary-btn">クリア</button>
                </div>
                <div class="tile-picker" id="tile-picker">
                    <!-- JavaScript will populate rows of Manzu, Pinzu, Souzu, Jihai -->
                </div>
            </div>

            <div class="action-section">
                <button type="button" id="calculate-btn" class="primary-btn">点数を計算する</button>
            </div>
        </main>

        <section class="result-section glassmorphism hidden" id="result-container">
            <h2>計算結果</h2>
            <div class="score-display">
                <span id="final-score" class="score-value">--</span>
                <span class="score-unit">点</span>
            </div>
            <div class="score-breakdown">
                <p id="han-fu-display">--翻 --符</p>
                <p id="detail-display">-----</p>
            </div>
            <div class="yaku-list-display" id="yaku-list-display">
                <!-- Yaku chips will be inserted here by script.js -->
            </div>
        </section>
    </div>
    <script src="logic.parser.js"></script>
    <script src="logic.yaku.js"></script>
    <script src="logic.js"></script>
    <script src="script.js"></script>
</body>

</html>
